volumes:
  db-volume:
  mailpit-data: {}

services:
  nginx:
    image: nginx:1.30.6
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/
    depends_on:
      - php

  php:
    build: ./docker/php
    volumes:
      - ./src:/var/www/

  node:
    image: node:24.22.1
    user: node
    working_dir: /var/www
    volumes:
      - ./src:/var/www/
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sf_db
      MYSQL_USER: sf_user
      MYSQL_PASSWORD: sf_pass
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf

  phpmyadmin:
    image: phpmyadmin:5.2.3
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - PMA_USER=sf_user
      - PMA_PASSWORD=sf_pass
    depends_on:
      - mysql
    ports:
      - "8080:80"

  mail:
    image: axllent/mailpit:v1.31.6
    ports:
      - "8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
