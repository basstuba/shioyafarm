volumes:
  db-volume:
  mailpit-data: {}

services:
  nginx:
    image: nginx:1.30.6
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/
    depends_on:
      - php

  php:
    build: ./docker/php
    volumes:
      - ./src:/var/www/

  node:
    image: node:24.22.1
    user: node
    working_dir: /var/www
    volumes:
      - ./src:/var/www/
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"

  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sf_db
      MYSQL_USER: sf_user
      MYSQL_PASSWORD: sf_pass
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf

  phpmyadmin:
    image: phpmyadmin:5.2.3
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=mysql
      - PMA_USER=sf_user
      - PMA_PASSWORD=sf_pass
    depends_on:
      - mysql
    ports:
      - "8080:80"

  mail:
    image: axllent/mailpit:v1.31.6
    ports:
      - "8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data

  # ここから E2E テスト用（docker compose --profile e2e で起動する。開発用の php・nginx・DB とは別）
  php-e2e:
    build: ./docker/php
    profiles: ["e2e"]
    environment:
      # Laravel が src/.env.e2e を読む（DB は sf_db_e2e）
      APP_ENV: e2e
      # .env.e2e が無く .env が読まれたときも、開発用DB（sf_db）を作り直さないよう DB 名はここで固定する
      DB_DATABASE: sf_db_e2e
    volumes:
      - ./src:/var/www/
    depends_on:
      - mysql
      - mail

  nginx-e2e:
    image: nginx:1.30.6
    profiles: ["e2e"]
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/e2e.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/
    depends_on:
      - php-e2e

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["e2e"]
    user: "1000:1000"
    working_dir: /e2e
    ipc: host
    environment:
      HOME: /tmp
      BASE_URL: http://nginx-e2e
      MAILPIT_URL: http://mail:8025
    volumes:
      - ./e2e:/e2e
    depends_on:
      - nginx-e2e
      - mail
