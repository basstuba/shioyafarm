; 本番用の PHP の設定（conf.d に置く。開発用の docker/php/php.ini とは別）
date.timezone = "Asia/Tokyo"
memory_limit = 512M
expose_php = Off
display_errors = Off
log_errors = On

[mbstring]
mbstring.language = "Japanese"

; 商品画像のアップロード（アプリの検証は10MBまで。Caddy の上限は16MiB）
upload_max_filesize = 12M
post_max_size = 16M

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; コードはイメージに入っていて実行中に変わらないため、ファイルの更新を確かめない（コードを変えたらイメージを作り直す）
opcache.validate_timestamps = 0
