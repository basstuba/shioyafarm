; 本番用の PHP-FPM のプール設定（php-fpm.d/zz-app.conf。www.conf・zz-docker.conf のあとに読まれて上書きする）
[www]
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; コンテナの環境変数（DB・APP_KEY など）をワーカーから読めるようにする
clear_env = no
; ワーカーの標準エラー出力（Laravel のログ LOG_CHANNEL=stderr）をコンテナのログに流す
catch_workers_output = yes
decorate_workers_output = no
